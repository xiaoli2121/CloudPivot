spring:
  application:
    name: cloudpivot-boot
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:cloudpivot-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
server:
  port: 8080
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  packages-to-scan: io.cloudpivot
  default-flat-param-object: true
cloudpivot:
  auth:
    state-store: memory
    cache-ttl-seconds: 1800
    login-fail-threshold: 5
    login-lock-duration-seconds: 1800
    jwt:
      secret: Y2xvdWRwaXZvdC1jb21tdW5pdHktMS0wLWF1dGgtc2VjcmV0LXNob3VsZC1iZS1sb25n
      issuer: cloudpivot
      access-token-ttl: 7200
      refresh-token-ttl: 604800
      clock-skew-seconds: 60
